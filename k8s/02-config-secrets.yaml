# Non-secret database settings, exposed to the app as environment variables
apiVersion: v1
kind: ConfigMap
metadata:
  name: trip-tracker-config
  namespace: trip-tracker
data:
  DB_HOST: "psql-trip-tracker-y4ed2m.postgres.database.azure.com"
  DB_PORT: "5432"
  DB_NAME: "tripdb"
  DB_USER: "pgadmin"
  DB_SSLMODE: "require"
---
# Tells the Secrets Store CSI driver WHICH secret to fetch from WHICH vault, using WHICH identity.
# secretObjects also syncs it into a Kubernetes Secret so the app can read it as an env var.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: trip-tracker-kv
  namespace: trip-tracker
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    clientID: "c8c8418d-611c-430e-acb2-304d7e42f59b"
    keyvaultName: "kv-trip-tracker-y4ed2m"
    tenantId: "20121400-7e6e-4763-8869-c2148da62188"
    objects: |
      array:
        - |
          objectName: db-admin-password

          objectType: secret
  secretObjects:
    - secretName: trip-tracker-db
      type: Opaque
      data:
        - objectName: db-admin-password
          key: DB_PASSWORD
