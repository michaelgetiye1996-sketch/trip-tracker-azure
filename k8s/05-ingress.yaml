# HTTPS entry: routes https://trip-tracker-y4ed2m.eastus2.cloudapp.azure.com to the app Service.
# cert-manager sees the annotation, gets a trusted Let's Encrypt certificate, stores it in Secret trip-tracker-tls.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: trip-tracker
  namespace: trip-tracker
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - trip-tracker-y4ed2m.eastus2.cloudapp.azure.com
      secretName: trip-tracker-tls
  rules:
    - host: trip-tracker-y4ed2m.eastus2.cloudapp.azure.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: trip-tracker
                port:
                  name: http
---
# Traefik middleware: answer plain HTTP with a permanent redirect to HTTPS
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: https-redirect
  namespace: trip-tracker
spec:
  redirectScheme:
    scheme: https
    permanent: true
---
# HTTP entry (port 80 only): everything gets redirected to HTTPS.
# cert-manager's temporary challenge Ingress uses a longer path, so Traefik gives it priority during renewals.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: trip-tracker-http-redirect
  namespace: trip-tracker
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
    traefik.ingress.kubernetes.io/router.middlewares: trip-tracker-https-redirect@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: trip-tracker-y4ed2m.eastus2.cloudapp.azure.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: trip-tracker
                port:
                  name: http
